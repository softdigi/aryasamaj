; /etc/supervisor/conf.d/aryasamaj-worker.conf
;
; Supervisor configuration for Laravel queue workers.
; After editing, run:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start aryasamaj-worker:*

[program:aryasamaj-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/aryasamaj/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aryasamaj-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600
