# /etc/nginx/sites-available/aryasamaj
#
# Nginx virtual-host for aryasamaj.site
# Symlink to sites-enabled:
#   ln -s /etc/nginx/sites-available/aryasamaj /etc/nginx/sites-enabled/aryasamaj
#   nginx -t && systemctl reload nginx

# Rate-limit zones
limit_req_zone  $binary_remote_addr  zone=api_limit:10m   rate=30r/m;
limit_req_zone  $binary_remote_addr  zone=otp_limit:2m    rate=5r/m;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name aryasamaj.site www.aryasamaj.site;

    # ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name aryasamaj.site www.aryasamaj.site;

    root  /var/www/aryasamaj/public;
    index index.php;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/aryasamaj.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aryasamaj.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Connection limits ────────────────────────────────────────────────────
    limit_conn conn_limit 20;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json application/javascript
                    application/rss+xml application/atom+xml image/svg+xml;

    # ── Client limits ─────────────────────────────────────────────────────────
    client_max_body_size    50M;
    client_body_timeout     30s;
    client_header_timeout   30s;
    keepalive_timeout       75s;
    send_timeout            30s;

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|woff2?|ttf|otf|eot|css|js|map)$ {
        expires     30d;
        add_header  Cache-Control "public, immutable";
        access_log  off;
        try_files   $uri =404;
    }

    # ── Public file storage (symlinked) ──────────────────────────────────────
    location /storage/ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri $uri/ =404;
    }

    # ── Public uploads directory ─────────────────────────────────────────────
    location /uploads/ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri $uri/ =404;
    }

    # ── API rate limiting ─────────────────────────────────────────────────────
    location /app_api/api/send-otp {
        limit_req zone=otp_limit burst=2 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    }

    location /app_api/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Horizon dashboard (admin only — restrict by IP) ───────────────────────
    location /horizon {
        # Allow only trusted IPs; remove or extend for your admin IP range
        allow 127.0.0.1;
        deny  all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Main Laravel entry point ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size  16k;
        fastcgi_buffers      4 16k;
    }

    # ── Deny access to hidden files ───────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Deny direct access to .env and sensitive files ────────────────────────
    location ~* \.(env|log|sh|sql|conf)$ {
        deny all;
    }

    # ── Access & error logs ───────────────────────────────────────────────────
    access_log /var/log/nginx/aryasamaj-access.log combined buffer=16k flush=5m;
    error_log  /var/log/nginx/aryasamaj-error.log warn;
}
