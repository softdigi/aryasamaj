; /etc/php/8.2/fpm/pool.d/aryasamaj.conf
;
; Dedicated PHP-FPM pool for the Arya Samaj Laravel application.
; This pool runs as www-data and is separate from any other site pools.
; After editing, reload PHP-FPM:
;   systemctl reload php8.2-fpm

[aryasamaj]

; ── User / group ──────────────────────────────────────────────────────────────
user  = www-data
group = www-data

; ── Listen socket ─────────────────────────────────────────────────────────────
; Use a Unix socket for best performance (Nginx must have r/w access).
listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ── Process management ────────────────────────────────────────────────────────
; dynamic: spawns workers on demand between pm.min_spare_servers and
;          pm.max_spare_servers, up to pm.max_children.
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers after this many requests to prevent memory leaks.
pm.max_requests      = 500

; ── Timeouts ──────────────────────────────────────────────────────────────────
request_terminate_timeout = 60s
request_slowlog_timeout   = 5s
slowlog                   = /var/log/php8.2-fpm-aryasamaj-slow.log

; ── Logging ───────────────────────────────────────────────────────────────────
access.log    = /var/log/php8.2-fpm-aryasamaj-access.log
; Log only 4xx/5xx to keep the access log clean in production
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dsec %{kilo}Mmb %C%%"

; ── Environment variables passed to PHP workers ───────────────────────────────
; Laravel reads APP_ENV, APP_KEY, etc. from the system environment.
; Do NOT put secrets here; set them in /etc/environment or the systemd unit.
env[HOSTNAME]  = $HOSTNAME
env[PATH]      = /usr/local/bin:/usr/bin:/bin
env[TMP]       = /tmp
env[TMPDIR]    = /tmp
env[TEMP]      = /tmp

; ── PHP INI overrides ─────────────────────────────────────────────────────────
php_admin_value[error_log]            = /var/log/php8.2-fpm-aryasamaj-errors.log
php_admin_flag[log_errors]            = on
php_flag[display_errors]              = off
php_value[memory_limit]               = 256M
php_value[upload_max_filesize]        = 50M
php_value[post_max_size]              = 52M
php_value[max_execution_time]         = 60
php_value[max_input_vars]             = 3000
php_value[session.save_handler]       = files
php_value[session.save_path]          = /var/lib/php/sessions
php_value[opcache.enable]             = 1
php_value[opcache.memory_consumption] = 128
php_value[opcache.max_accelerated_files] = 10000
php_value[opcache.revalidate_freq]    = 0
php_value[opcache.validate_timestamps]= 0
