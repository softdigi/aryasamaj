; /etc/supervisor/conf.d/aryasamaj-horizon.conf
;
; Supervisor configuration for Laravel Horizon (Redis queue dashboard).
; After editing, run:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start aryasamaj-horizon:*

[program:aryasamaj-horizon]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/aryasamaj/artisan horizon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aryasamaj-horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
; Allow Horizon's graceful shutdown: waits for running jobs to finish
stopwaitsecs=3600
; Send SIGTERM on stop so Horizon terminates cleanly
stopsignal=TERM
