name: arya_samaj_app
description: Arya Samaj Community Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # UI Components
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Media Players
  just_audio: ^0.9.39
  just_audio_background: ^0.0.1-beta.11
  video_player: ^2.8.3
  chewie: ^1.7.5
  flutter_pdfview: ^1.3.2

  # Utils
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  open_filex: ^4.4.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.1+2
  firebase_core: ^2.31.1
  firebase_messaging: ^14.9.4
  razorpay_flutter: ^1.3.6

  # UI Extras
  lottie: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  pinput: ^3.0.0
  fluttertoast: ^8.2.6
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
